# Finds the right machine from a natural request.
#
# The fixture catalog has exactly two machines — Form 4 (resin printer) and
# Trotec Speedy 400 (CO2 laser) — so "the right answer" is unambiguous.

- id: laser-by-capability
  prompt: "I need to cut a sheet of 3mm acrylic for a class project. What should I use?"
  context: { page: gallery }
  assert:
    - kind: mentions_tool
      value: "Trotec Speedy 400"
    - kind: no_unknown_tools

- id: resin-printer-by-capability
  prompt: "I need a really smooth, high-detail miniature for a design review. Which printer should I use?"
  context: { page: gallery }
  assert:
    - kind: mentions_tool
      value: "Form 4"
    - kind: no_unknown_tools

- id: full-catalog-listing
  prompt: "What machines does the lab have?"
  context: { page: gallery }
  assert:
    - kind: contains_all
      value: ["Form 4", "Trotec Speedy 400"]
    - kind: no_unknown_tools

# Performance plan, quick win 1: "what do you have" questions are answered from
# the catalog listing in the prompt, without a list_tools round trip (it cost a
# whole model step, about 1.5–2s before the first word).
- id: printers-listed-from-prompt
  prompt: "What 3D printers do you have?"
  context: { page: gallery }
  assert:
    - kind: mentions_tool
      value: "Form 4"
    - kind: not_called_tool
      value: list_tools
    - kind: no_unknown_tools

- id: room-listed-from-prompt
  prompt: "What's in the Laser Room?"
  context: { page: gallery }
  assert:
    - kind: mentions_tool
      value: "Trotec Speedy 400"
    - kind: not_called_tool
      value: list_tools
    - kind: no_unknown_tools
