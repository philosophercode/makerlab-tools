<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- ISAM 2026 demo extended-abstract template. build.mjs fills the {{…}} slots
     from abstract-v2.md. Geometry per ISAM-2026-Demo-Template: Letter, 0.75 in
     margins (7 × 9.5 in print area), two 3.4 in columns with a 0.2 in gutter,
     Times; title 16 pt, authors 12 pt, affiliations and body 10 pt,
     references 8 pt, captions below figures. -->
<title>{{TITLE_TEXT}}</title>
<style>
  @page { size: 8.5in 11in; margin: 0.75in; }
  html { font-family: "Times New Roman", Times, serif; }
  body { margin: 0; font-size: 10pt; line-height: 1.12; text-align: justify; hyphens: auto; -webkit-hyphens: auto; }

  .header { text-align: center; margin-bottom: 0.4in; }
  .venue { font-size: 10pt; margin: 0 0 2pt 0; }
  .title { font-size: 16pt; font-weight: normal; margin: 0 0 6pt 0; line-height: 1.1; }
  .authors { font-size: 12pt; margin: 0 0 3pt 0; }
  .affil { font-size: 10pt; margin: 0; line-height: 1.25; text-align: center; }
  .header figure { margin: 8pt 0 0 0; }

  .doc { column-count: 2; column-width: 3.4in; column-gap: 0.2in; column-fill: auto; }

  h2 { font-size: 10pt; font-weight: bold; margin: 6pt 0 2pt 0; break-after: avoid; text-align: left; }
  h3 { font-size: 10pt; font-weight: bold; font-style: italic; margin: 4pt 0 1pt 0; break-after: avoid; text-align: left; }
  p { margin: 0 0 3pt 0; }
  ul { margin: 0 0 3pt 0; padding-left: 1.1em; }
  li { margin: 0 0 1pt 0; }
  a { color: inherit; text-decoration: none; }
  .abstract-label { font-weight: bold; font-style: italic; }

  figure { margin: 4pt 0 5pt 0; break-inside: avoid; text-align: center; }
  figure img { max-width: 100%; height: auto; border: 0.5pt solid #999; display: block; margin: 0 auto; }
  figcaption { font-size: 8.5pt; line-height: 1.12; margin-top: 2pt; text-align: justify; }

  .ack p { font-size: 9pt; margin: 0 0 2pt 0; }
  .refs p { hyphens: manual; -webkit-hyphens: manual; overflow-wrap: anywhere; font-size: 8pt; margin: 0 0 2pt 0; text-indent: -1.4em; padding-left: 1.4em; text-align: left; }
</style>
</head>
<body>
<div class="header">
{{HEADER}}
</div>
<div class="doc">
{{BODY}}
</div>
</body>
</html>
