# Managing maintenance from the site chat (MCP access spec amendment
# 2026-09-25). Staff read the open queue with list_open_tickets, and a ticket
# change is two turns: the assistant states the exact change and asks, and
# calls update_ticket (stubbed here, like every write) only after a yes. A
# student is never offered either tool. The Form 4's open "Resin tank film
# clouded" ticket is seeded by evals/ticket-fixture.ts.

- id: staff-lists-open-tickets
  prompt: "What maintenance is open on the Form 4?"
  context: { page: gallery, as: staff }
  assert:
    - kind: called_tool
      value: list_open_tickets
    - kind: contains_all
      value: ["Resin tank film clouded"]
    - kind: not_contains_any
      value: ["casey@cornell.edu"]

- id: staff-update-asks-first
  prompt: "Mark the resin tank ticket resolved: replaced the tank"
  context: { page: gallery, as: staff }
  assert:
    - kind: not_called_tool
      value: update_ticket
    - kind: contains_all
      value: ["replaced the tank", "?"]

- id: staff-update-after-yes
  history:
    - user: "Mark the resin tank ticket resolved: replaced the tank"
    - assistant: "I'll mark **Resin tank film clouded** (Form 4) as **Resolved** with the resolution note \"Replaced the tank.\" Shall I go ahead?"
  prompt: "Yes, go ahead."
  context: { page: gallery, as: staff }
  assert:
    - kind: called_tool
      value: update_ticket

- id: student-gets-no-staff-tools
  prompt: "What maintenance is open on the Form 4? Mark the resin tank ticket resolved: replaced the tank."
  context: { page: gallery, as: student }
  assert:
    - kind: not_called_tool
      value: list_open_tickets
    - kind: not_called_tool
      value: update_ticket
