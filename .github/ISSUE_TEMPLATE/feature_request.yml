name: Feature idea
description: Suggest something new. Features start as a spec (docs/constitution.md, Article 1), so an issue first is a good way to check it fits.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who needs this, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: textarea
    id: lab
    attributes:
      label: Your lab
      description: Optional. Are you running a fork? What kind of space and equipment?
