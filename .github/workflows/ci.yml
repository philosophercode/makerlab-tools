# Every PR and every push to main: lint, typecheck, unit + workflow tests and
# spec coverage. Vercel's build runs none of the tests, so this is the gate
# (architecture review H1). The E2E suite runs too, as its own job (not yet a
# required check; TESTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (a tag can be moved);
# Dependabot (.github/dependabot.yml) proposes the bumps. Checkout does not
# leave the token in .git/config: npm ci and the tests run dependency code.

jobs:
  static:
    name: lint, typecheck, spec coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # The npm the lockfile is written with. Node 24's bundled npm (11.19)
      # validates the optional wasm32 builds' nested deps differently and
      # rejects this lockfile, while 11.6 rewrites the other way; bump both
      # together.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run spec:coverage -- --ci

  # ~530 test files take ~20 minutes on one 2-core runner, so they are split
  # four ways. The longer per-test timeout absorbs the slower machine; a few
  # tests (importing every locale file, for one) take ~5 s there.
  tests:
    name: tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/4 --testTimeout=30000

  # Playwright against a production build with the demo database and local stubs
  # (playwright.config.ts): no network beyond the runner. Not a required check
  # yet; promote it in branch protection once it has proved stable.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
