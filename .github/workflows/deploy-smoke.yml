# After every successful production deployment Vercel reports through GitHub,
# check the live site (scripts/smoke-production.sh). A failure here means:
# look, and roll back from the Vercel dashboard (Instant Rollback) if needed.
# Operational hardening spec, amendment 2026-10-06.
name: Deploy smoke test

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke test (production)
    # Only a finished, successful production deployment, or a manual run.
    # With a second Vercel project on the repository (makerlab-demo), Vercel
    # names the environment per project: "Production – makerlab-ai".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' ||
        github.event.deployment.environment == 'Production – makerlab-ai'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The production alias, not the per-deployment URL: deployment URLs sit
      # behind Vercel Authentication. A deployment that is not yet aliased is
      # caught by the retry below.
      - name: Smoke test
        env:
          SMOKE_BASE_URL: https://www.makerlabai.app
        run: |
          for attempt in 1 2 3; do
            if bash scripts/smoke-production.sh; then exit 0; fi
            echo "attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1
